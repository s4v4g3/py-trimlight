[project]
name = "py-trimlight"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joe Savage", email = "joe.savage@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.5",
]

[tool.ruff.lint]
extend-select = [
    "I",     # isort - import sorting
    "UP",    # pyupgrade - modernize Python code
    "B",     # flake8-bugbear - find likely bugs
    "S",     # flake8-bandit - security
    "C4",    # flake8-comprehensions - better comprehensions
    "SIM",   # flake8-simplify - simplify code
    "PL",    # pylint - comprehensive code analysis
]

# Ignore rules that are too strict for this project
ignore = [
    "S101",   # Use of assert (fine in non-production code)
    "PLR0913", # Too many arguments (sometimes necessary)
    "PLR2004", # Magic value used in comparison (sometimes fine)
]
